<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<nav class="navbar navbar-light bg-light">
  <a class="navbar-brand">
    <img src="pay.png" width="35"> Expense Tracker
  </a>
</nav>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center">

    <h4>Total Expense: ₹ <span class="totalExpense">0</span></h4>

    <button class="btn btn-primary" onclick="showAddExpenseModal()">
      Add Expense
    </button>

  </div>

  <hr>

  <table class="table table-bordered text-center mt-3">

    <thead>
      <tr>
        <th>#</th>
        <th>Description</th>
        <th>Date</th>
        <th>Spent Amount</th>
      </tr>
    </thead>

    <tbody id="expenseTableBody"></tbody>

  </table>

</div>

<div class="modal fade" id="addExpenseModel" tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5>Add Expense</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body">

        <form id="addExpenseForm">

          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" name="Description" required></textarea>
          </div>

          <div class="form-group">
            <label>Date</label>
            <input type="date" class="form-control" name="Date" required>
          </div>

          <div class="form-group">
            <label>Spent Amount</label>
            <input type="number" class="form-control" name="Spent" required>
          </div>

          <div class="modal-footer px-0">

            <button type="button" class="btn btn-secondary" data-dismiss="modal">
              Cancel
            </button>

            <button type="submit" class="btn btn-success">
              Save Expense
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function showAddExpenseModal(){
    $('#addExpenseModel').modal('show');
}

function saveExpense(){

    var dataArr = $('#addExpenseForm').serializeArray();

    var obj = {};
    var arr = [];

    var storage = localStorage.getItem("expenseStorage");

    for(var i in dataArr){
        obj[dataArr[i].name] = dataArr[i].value;
    }

    if(storage){
        arr = JSON.parse(storage);
    }

    arr.push(obj);

    localStorage.setItem("expenseStorage", JSON.stringify(arr));

    $('#addExpenseModel').modal('hide');
    $('#addExpenseForm')[0].reset();

    createTable();
    getTotal();
}

function createTable(){

    var storage = localStorage.getItem("expenseStorage");
    var arr = [];
    var html = "";

    if(storage){
        arr = JSON.parse(storage);
    }

    if(arr.length === 0){
        html = '<tr><td colspan="4">No Expense Added Yet</td></tr>';
    } else {

        for(var i in arr){
            html += `
            <tr>
                <td>${parseInt(i)+1}</td>
                <td>${arr[i].Description}</td>
                <td>${arr[i].Date}</td>
                <td>${arr[i].Spent}</td>
            </tr>
            `;
        }
    }

    $('#expenseTableBody').html(html);
}

function getTotal(){

    var storage = localStorage.getItem("expenseStorage");
    var arr = [];
    var total = 0;

    if(storage){
        arr = JSON.parse(storage);

        for(var i in arr){

            let val = parseFloat(arr[i].Spent);

            if(!isNaN(val)){
                total += val;
            }
        }
    }

    $('.totalExpense').text(total);
}

$('#addExpenseForm').submit(function(e){
    e.preventDefault();
    saveExpense();
});

createTable();
getTotal();

</script>

</body>
</html>
